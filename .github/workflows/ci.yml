name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        powershell: ['7.4.20', '7.5.11', '7.6.6']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact PowerShell version
        shell: pwsh
        run: |
          $version = '${{ matrix.powershell }}'
          $architecture = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          if ($IsWindows) {
            $asset = "PowerShell-$version-win-$architecture.zip"
          } elseif ($IsMacOS) {
            $asset = "powershell-$version-osx-$architecture.tar.gz"
          } else {
            $asset = "powershell-$version-linux-$architecture.tar.gz"
          }
          $base = "https://github.com/PowerShell/PowerShell/releases/download/v$version"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $hashFile = Join-Path $env:RUNNER_TEMP 'powershell-hashes.sha256'
          Invoke-WebRequest "$base/$asset" -OutFile $archive
          Invoke-WebRequest "$base/hashes.sha256" -OutFile $hashFile
          $entry = Get-Content $hashFile | Where-Object { $_.TrimEnd().EndsWith($asset, [StringComparison]::Ordinal) } | Select-Object -First 1
          if (-not $entry) { throw "No release checksum found for $asset." }
          $expected = ($entry -split '\s+')[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Checksum mismatch for $asset." }
          $installPath = Join-Path $env:RUNNER_TEMP "pwsh-$version"
          New-Item -ItemType Directory -Path $installPath -Force | Out-Null
          if ($IsWindows) {
            Expand-Archive -Path $archive -DestinationPath $installPath -Force
          } else {
            tar -xzf $archive -C $installPath
            if ($LASTEXITCODE -ne 0) { throw 'PowerShell archive extraction failed.' }
            chmod +x (Join-Path $installPath 'pwsh')
            if ($LASTEXITCODE -ne 0) { throw 'Unable to mark pwsh executable.' }
          }
          $installPath | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $installPath 'pwsh') -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: Validate manifest
        shell: pwsh
        run: Test-ModuleManifest ./src/BetaCalendars.CalendarTools/BetaCalendars.CalendarTools.psd1 | Out-Null
      - name: Install quality tools
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force
      - name: Analyze
        shell: pwsh
        run: |
          $issues = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning)
          $issues | Format-Table -AutoSize
          if ($issues.Where({$_.Severity -eq 'Error'}).Count) { throw 'PSScriptAnalyzer errors found.' }
      - name: Import and smoke test
        shell: pwsh
        run: |
          Import-Module ./src/BetaCalendars.CalendarTools/BetaCalendars.CalendarTools.psd1 -Force
          if ((New-BCMonthGrid -Year 2027 -Month 1).Cells.Count -ne 42) { throw 'Grid must have 42 cells.' }
          if ((New-BCYearGrid -Year 2027).Months.Count -ne 12) { throw 'Year must contain twelve months.' }
          if ((New-BCYearTurnFixture -Year 2026)[3].DaysInMonth -ne 28) { throw 'Expected February 2027 to have 28 days.' }
          if ((New-BCYearTurnFixture -Year 2027)[3].DaysInMonth -ne 29) { throw 'Expected February 2028 to have 29 days.' }
          Get-Command -Module BetaCalendars.CalendarTools | Out-Null
          Get-Help New-BCMonthGrid -Examples | Out-Null
      - name: Pester
        shell: pwsh
        run: |
          Invoke-Pester ./tests -CI
      - name: Run examples and help smoke tests
        shell: pwsh
        run: |
          Get-ChildItem ./examples -Filter *.ps1 | ForEach-Object { & $_.FullName | Out-Null }
          Import-Module ./src/BetaCalendars.CalendarTools/BetaCalendars.CalendarTools.psd1 -Force
          foreach ($command in (Get-Command -Module BetaCalendars.CalendarTools -CommandType Function)) {
            if (-not (Get-Help $command.Name -Full).Synopsis) { throw "Missing help for $($command.Name)." }
          }
      - name: Local publish and install smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bc-local-gallery'
          $stage = Join-Path $env:RUNNER_TEMP 'bc-stage'
          $publishPath = Join-Path $stage 'BetaCalendars.CalendarTools'
          New-Item -ItemType Directory -Path $root,$stage -Force | Out-Null
          Copy-Item ./src/BetaCalendars.CalendarTools $publishPath -Recurse -Force
          Register-PSRepository -Name BCValidation -SourceLocation $root -PublishLocation $root -InstallationPolicy Trusted
          Publish-Module -Path $publishPath -Repository BCValidation -NuGetApiKey local-only -ErrorAction Stop
          Install-Module -Name BetaCalendars.CalendarTools -Repository BCValidation -Scope CurrentUser -Force -ErrorAction Stop
          Import-Module BetaCalendars.CalendarTools -Force -ErrorAction Stop
          if ((New-BCMonthGrid -Year 2027 -Month 1).Cells.Count -ne 42) { throw 'Installed month grid did not contain 42 cells.' }
          if ((New-BCYearGrid -Year 2027).Months.Count -ne 12) { throw 'Installed year grid did not contain twelve months.' }
